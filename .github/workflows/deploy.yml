name: CI/CD to AWS EC2

on:
  push:
    branches: [ main ] # Triggers whenever you push to your main/master branch

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # --- Step 1: Build and Push Docker Image ---
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./CRUD_CT_FE
          file: ./CRUD_CT_FE/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/frontend-app:latest

      # --- Step 2: Deploy to EC2 via SSH ---
      - name: Deploy to EC2 via SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          
          echo "Host *" >> ~/.ssh/config
          echo "    StrictHostKeyChecking no" >> ~/.ssh/config
          
          ssh ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'
            echo "Successfully connected to EC2!"
            # Add your server deployment commands here:
            # docker pull ${{ secrets.DOCKER_USERNAME }}/frontend-app:latest
            # docker stop frontend-container || true
            # docker rm frontend-container || true
            # docker run -d --name frontend-container -p 80:80 ${{ secrets.DOCKER_USERNAME }}/frontend-app:latest
          EOF