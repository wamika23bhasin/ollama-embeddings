name: CI/CD to AWS EC2

on:
  push:
    branches: [ main ] # Triggers whenever you push to your main/master branch

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
            context: ./CRUD_CT_FE          # Points to your frontend folder
            file: ./CRUD_CT_FE/Dockerfile  # Points to the exact Dockerfile path
            push: true
            tags: |
              ${{ secrets.DOCKER_USERNAME }}/frontend-app:latest

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker stop $(docker ps -a -q) || true
            docker rm $(docker ps -a -q) || true
            docker pull ${{ secrets.DOCKER_USERNAME }}/frontend-app:latest
            docker run -d -p 80:80 ${{ secrets.DOCKER_USERNAME }}/frontend-app:latest